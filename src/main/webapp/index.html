<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лабораторна робота №2 - Сервлети</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f6f8fa; color: #24292f; }
        main { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
        h1 { font-size: 26px; margin: 0 0 4px; }
        h2 { font-size: 20px; margin: 0 0 8px; }
        .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 16px 20px; margin: 18px 0; }
        label { display: block; margin: 10px 0 4px; font-size: 14px; }
        input { width: 100%; max-width: 320px; padding: 7px 9px; border: 1px solid #8c959f; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        button { margin-top: 14px; padding: 8px 18px; border: 0; border-radius: 6px; background: #0969da; color: #fff; font-size: 15px; cursor: pointer; }
        .muted { color: #57606a; font-size: 14px; }
    </style>
</head>
<body>
<main>
    <h1>Практична робота №2. Сервлети</h1>
    <p class="muted">Станція техобслуговування - допоміжні обчислення (варіант 4)</p>

    <div class="card">
        <h2>Завдання 2.1. Ряд arctg x</h2>
        <p class="muted">arctg x = x - x<sup>3</sup>/3 + x<sup>5</sup>/5 - x<sup>7</sup>/7 + ... (R = 1). Потрібно |x| &lt; 1.</p>
        <form action="task1" method="get">
            <label for="x">x:</label>
            <input id="x" name="x" value="0.5" required>
            <label for="n">n (кількість доданків):</label>
            <input id="n" name="n" type="number" min="1" value="10" required>
            <label for="e">e (точність):</label>
            <input id="e" name="e" value="0.001" required>
            <button type="submit">Обчислити</button>
        </form>
    </div>

    <div class="card">
        <h2>Завдання 2.2. Табулювання y = x<sup>0.2</sup></h2>
        <p class="muted">Табулювання функції на відрізку [a; b] з кроком h та графік.</p>
        <form action="task2" method="get">
            <label for="a">a (початок відрізка):</label>
            <input id="a" name="a" value="0" required>
            <label for="b">b (кінець відрізка):</label>
            <input id="b" name="b" value="5" required>
            <label for="h">h (крок):</label>
            <input id="h" name="h" value="0.5" required>
            <button type="submit">Побудувати</button>
        </form>
    </div>
</main>
</body>
</html>
